# ============================================================
# VisionGuard-AD — FastFlow Configuration
# "FastFlow: Unsupervised Anomaly Detection and Localization
#  via 2D Normalizing Flows"
# Optimized for Apple Silicon M1 (MPS backend)
# ============================================================

model:
  backbone: wide_resnet50        # Options: wide_resnet50, resnet18, resnet50, efficientnet_b4, vit_b16
  layers:
    - layer2
    - layer3
  pretrained: true
  flow_steps: 8                  # Number of coupling layers in the normalizing flow
  hidden_channels: 256           # Hidden channels in s_net/t_net of coupling layers
  kernel_size: 3                 # Kernel size for coupling layer CNNs
  clamp: 2.0                    # Clamping value for scale parameter

training:
  img_size: 256
  batch_size: 16                 # Smaller batch for M1 memory constraints
  num_workers: 4
  num_epochs: 100
  warmup_epochs: 5
  learning_rate: 0.0001          # Adam optimizer
  weight_decay: 0.00001
  lr_scheduler: cosine           # CosineAnnealingLR
  lr_min: 1.0e-6
  gradient_clip: 1.0
  device: auto
  seed: 42
  early_stopping_patience: 15    # Stop if val loss doesn't improve for 15 epochs

data:
  dataset: mvtec
  root: ./data/mvtec
  category: carpet
  val_ratio: 0.1

inference:
  anomaly_map_blur_sigma: 4.0
  normalize_method: minmax

output:
  dir: ./outputs
  save_visualizations: true
  num_vis_samples: 20
  save_training_curve: true
  checkpoint_interval: 10        # Save checkpoint every N epochs
  log_level: INFO

threshold:
  default: 0.5
  optimization_criterion: f1
  cost_fp: 1.0
  cost_fn: 10.0
